name: tests
on:  # once per PR commit, plus merges to claude/v1 (saves Actions minutes)
  push:
    branches: [claude/v1]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04  # Python 3.9 (the Mac's Xcode Python) is not built for newer Ubuntu images
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t . -v
